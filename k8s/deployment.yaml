# Kubernetes Deployment for Videre Backend
# Generated by Containerization Assist using AI

apiVersion: apps/v1
kind: Deployment
metadata:
  name: videre-backend
  namespace: videre
  labels:
    app: videre-backend
    version: "1.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: videre-backend
  template:
    metadata:
      labels:
        app: videre-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - videre-backend
                topologyKey: kubernetes.io/hostname
      serviceAccountName: videre-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: backend
          image: videre-backend:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: videre-backend-config
                  key: frontend_url
            - name: GOOGLE_CLOUD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: videre-backend-secrets
                  key: google-cloud-api-key
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: videre-backend-secrets
                  key: supabase-url
            - name: SUPABASE_KEY
              valueFrom:
                secretKeyRef:
                  name: videre-backend-secrets
                  key: supabase-key
            - name: SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: videre-backend-secrets
                  key: supabase-key
          livenessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
